<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 패널</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 기존 CSS 재사용 -->
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Jua', sans-serif; background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); color: #191f28; margin: 0; padding: 24px 16px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        h2 { font-size: 38px; font-weight: normal; margin-top: 0; margin-bottom: 5px; background: linear-gradient(135deg, #f04438 0%, #d92013 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        label { display: block; margin-bottom: 6px; font-size: 19px; color: #333d4b; }
        input { width: 100%; padding: 12px 14px; box-sizing: border-box; background-color: #f2f4f6; border: 1px solid transparent; border-radius: 12px; margin-bottom: 12px; font-size: 20px; font-family: 'Jua', sans-serif; color: #191f28; outline: none; }
        input:focus { background-color: #ffffff; border-color: #3182f6; box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #333d4b 0%, #191f28 100%); color: white; border: none; border-radius: 12px; font-size: 22px; font-family: 'Jua', sans-serif; cursor: pointer; transition: transform 0.1s; margin-top: 10px; }
        button:active { transform: scale(0.98); }
        .result-msg { text-align: center; margin-top: 15px; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ 관리자 패널</h2>
    <div style="font-size: 18px; color: #8b95a1; margin-bottom: 20px;">모금액 조작 및 목표 설정</div>

    <div>
        <label>비밀번호 (필수)</label>
        <input type="password" id="adminPw" placeholder="boji">
        
        <label>새 목표 금액 설정 (수정할 때만 입력)</label>
        <input type="number" id="targetInput" placeholder="예: 50000">
        
        <label>현재 모금액 올리기 (+)</label>
        <input type="number" id="addInput" placeholder="예: 5000">

        <button onclick="updateStatus()">적용하기</button>
        <div id="msgBox" class="result-msg"></div>
    </div>
</div>

<script>
    async function updateStatus() {
        const pw = document.getElementById('adminPw').value;
        const target = document.getElementById('targetInput').value;
        const add = document.getElementById('addInput').value;
        const msgBox = document.getElementById('msgBox');
        
        if(!pw) {
            msgBox.style.color = '#f04438';
            msgBox.innerText = "비밀번호를 입력하세요.";
            return;
        }

        const formData = new URLSearchParams();
        formData.append('password', pw);
        if(target) formData.append('target', target);
        if(add) formData.append('add_amount', add);

        try {
            const res = await fetch('/api/admin/update', { method: 'POST', body: formData });
            const data = await res.json();

            if(data.success) {
                msgBox.style.color = '#3182f6';
                msgBox.innerHTML = `✅ 적용 완료!<br>현재: ${data.current} / 목표: ${data.target}<br>` + 
                                   (data.unlocked ? `<span style="color:#f04438;">(현재 잠금 해제됨)</span>` : `(현재 잠금 상태)`);
                document.getElementById('addInput').value = ""; // 추가 인풋만 비워줌
            } else {
                msgBox.style.color = '#f04438';
                msgBox.innerText = "❌ " + data.error;
            }
        } catch(e) {
            msgBox.style.color = '#f04438';
            msgBox.innerText = "서버 통신 오류";
        }
    }
</script>

</body>
</html>
