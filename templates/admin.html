<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>냥슬리 관리자 패널</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141414;--line:#2a2a2a;--ink:#f5f5f5;--sub:#c8c8c8;--ok:#3dd68c;--danger:#ff453a;--gold:#e6a822;--blue:#0a84ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Nanum Gothic',system-ui,sans-serif;font-size:17px;line-height:1.35;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
button,input,select,a{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:30px;font-weight:400;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:15px;margin:4px 0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.section{display:none}
.section.active{display:block}
.msg{font-size:15px;color:var(--ok);min-height:0;margin-bottom:8px}
.msg:empty{display:none}
.msg.error{color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#1c1c1c;text-decoration:none;font-size:17px;font-weight:400}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#fff;color:#000;border-color:#fff}
.danger{background:#3a1a1a;color:#ff8a80;border-color:#5a2a2a}
.btn-small{min-height:36px;padding:6px 10px;font-size:14px;width:auto;border-radius:10px}
.input{width:100%;height:50px;margin-top:8px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0c0c0c;font-size:17px}
select.input{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c8c8c8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:16px}
h2{font-size:22px;font-weight:400;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.hint{color:var(--sub);font-size:14px;margin:4px 0 8px}
.hidden{display:none!important}
.cred{padding:12px;border:1px solid var(--line);border-radius:12px;background:#1a1a1a;cursor:pointer}
.cred small{color:var(--sub);font-size:13px}
.cred strong{display:block;margin-top:4px;font-size:22px;font-weight:400;letter-spacing:1px;color:#fff}
.toggle-switch{position:relative;display:inline-block;width:51px;height:31px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#333;border-radius:34px;transition:.25s}
.toggle-slider:before{position:absolute;content:"";height:27px;width:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.25s}
input:checked+.toggle-slider{background:#fff}
input:checked+.toggle-slider:before{transform:translateX(20px);background:#000}
.key-item{background:#1c1c1c;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.key-item.expired{opacity:.55}
.key-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.key-val{font-weight:700;font-size:16px;letter-spacing:.5px;cursor:pointer;color:#fff}
.key-val:hover{color:var(--ok)}
.tier-badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;margin-right:6px;color:#fff}
.tier-gold{background:linear-gradient(135deg,#ffcc33,#e6a822);color:#000}
.tier-vip{background:linear-gradient(135deg,#3fa9ff,#0a84ff)}
.key-meta{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.key-meta b{color:var(--ink);font-weight:400}
.action-group{display:flex;gap:6px;flex-shrink:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--sub);margin:8px 0}
.stats span{background:#1c1c1c;padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.footer-mark{text-align:center;margin-top:24px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div class="app">
  <h1>냥슬리 관리자</h1>
  <p class="sub">인증 키 및 에디터 관리</p>
  <div id="message-box" class="msg"></div>

  <section id="section-login" class="panel">
    <h2>관리자 로그인</h2>
    <input id="admin-pass" class="input" type="password" placeholder="비밀번호" autocomplete="off">
    <button class="btn primary" style="margin-top:8px" onclick="checkPassword()">로그인</button>
  </section>

  <section id="section-denied" class="panel hidden">
    <p style="text-align:center;color:var(--danger);margin-bottom:12px">비밀번호가 올바르지 않습니다.</p>
    <button class="btn" onclick="location.reload()">다시 시도</button>
  </section>

  <div id="section-panel" class="hidden">
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div id="status-text" style="font-size:18px">에디터 개방됨</div>
          <div class="hint" style="margin:0">접속 제어</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="lock-toggle" onchange="toggleLock()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="panel">
      <h2>새 인증 키 발급</h2>
      <select id="key-type" class="input">
        <option value="gold_use_1">골드 1회용 (2,000원)</option>
        <option value="gold_1">골드 1일 무제한 (5,000원)</option>
        <option value="gold_999">골드 평생 무제한 (20,000원)</option>
        <option value="vip_use_1">VIP 1회용 (3,000원)</option>
        <option value="vip_1">VIP 1일 무제한 (6,000원)</option>
        <option value="vip_999">VIP 평생 무제한 (30,000원)</option>
      </select>
      <button class="btn primary" id="btn-generate" onclick="generateVipKey()" style="margin-top:8px">키 발급하기</button>
      <div id="new-key-container" class="hidden" style="margin-top:12px">
        <div class="cred" onclick="copyKey()">
          <small>발급된 키</small>
          <strong id="new-key"></strong>
        </div>
        <p class="hint" style="text-align:center;margin-top:6px">클릭하여 복사</p>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">발급된 키</h2>
        <button class="btn btn-small" onclick="loadKeys()">새로고침</button>
      </div>
      <input id="search-input" class="input" placeholder="키, 티어, 상태 검색" oninput="renderFiltered()">
      <div id="stats-bar" class="stats"></div>
      <div id="key-list"></div>
    </div>
  </div>

  <div class="footer-mark">Nyansly Engine Admin System</div>
</div>

<script>
const ADMIN_PASSWORD = "110923";
let allKeys = {};

function showMessage(msg, isError = false) {
  const box = document.getElementById('message-box');
  box.textContent = msg;
  box.className = 'msg' + (isError ? ' error' : '');
  box.classList.remove('hidden');
  setTimeout(() => { if (!isError) box.classList.add('hidden'); }, 3000);
}

function checkPassword() {
  const input = document.getElementById('admin-pass').value.trim();
  if (input === ADMIN_PASSWORD) {
    document.getElementById('section-login').classList.add('hidden');
    document.getElementById('section-panel').classList.remove('hidden');
    loadStatus();
    loadKeys();
  } else {
    document.getElementById('section-login').classList.add('hidden');
    document.getElementById('section-denied').classList.remove('hidden');
  }
}

document.getElementById('admin-pass').addEventListener('keypress', e => {
  if (e.key === 'Enter') checkPassword();
});

async function loadStatus() {
  try {
    const response = await fetch('/api/lock_status');
    const data = await response.json();
    updateToggleUI(data.locked);
  } catch (e) { showMessage("상태를 불러오지 못했습니다.", true); }
}

function updateToggleUI(locked) {
  document.getElementById('lock-toggle').checked = locked;
  const statusText = document.getElementById('status-text');
  if (locked) {
    statusText.textContent = "에디터 잠금됨";
    statusText.style.color = "var(--danger)";
  } else {
    statusText.textContent = "에디터 개방됨";
    statusText.style.color = "var(--ok)";
  }
}

async function toggleLock() {
  const checkbox = document.getElementById('lock-toggle');
  const desiredState = checkbox.checked;
  const formData = new FormData();
  formData.append('locked', desiredState);
  try {
    const response = await fetch('/api/toggle_lock', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) {
      updateToggleUI(desiredState);
      showMessage(desiredState ? "에디터 접속을 차단했습니다." : "에디터 접속을 허용했습니다.");
    } else {
      checkbox.checked = !desiredState;
      showMessage(data.error || "변경 실패", true);
    }
  } catch (e) {
    checkbox.checked = !desiredState;
    showMessage("서버 통신 중 오류가 발생했습니다.", true);
  }
}

async function generateVipKey() {
  const btn = document.getElementById('btn-generate');
  const selection = document.getElementById('key-type').value;
  const parts = selection.split('_');
  const tier = parts[0];
  const duration = parts.slice(1).join('_');

  btn.disabled = true;
  btn.textContent = "발급 중...";

  const formData = new FormData();
  formData.append('admin_password', ADMIN_PASSWORD);
  formData.append('duration_type', duration);
  formData.append('tier', tier);

  try {
    const response = await fetch('/api/generate_key', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) {
      document.getElementById('new-key').textContent = data.key;
      document.getElementById('new-key-container').classList.remove('hidden');
      showMessage("새 키가 발급되었습니다.");
      loadKeys();
    } else showMessage(data.error || "키 발급 실패", true);
  } catch (e) { showMessage("서버 통신 중 오류가 발생했습니다.", true); }
  finally { btn.disabled = false; btn.textContent = "키 발급하기"; }
}

async function loadKeys() {
  const formData = new FormData();
  formData.append('admin_password', ADMIN_PASSWORD);
  try {
    const response = await fetch('/api/list_keys', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) {
      allKeys = data.keys || {};
      renderFiltered();
    }
  } catch (e) { showMessage("키 목록을 불러오지 못했습니다.", true); }
}

function renderFiltered() {
  const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const now = Math.floor(Date.now() / 1000);
  let list = Object.keys(allKeys).map(k => ({ id: k, ...allKeys[k] }));
  if (q) {
    list = list.filter(k => {
      const text = [k.id, k.tier, k.key_type, k.bound_device_id ? '기기등록' : '미등록'].join(' ').toLowerCase();
      return text.includes(q);
    });
  }
  list.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  renderKeys(list, now);
  updateStats(list, now);
}

function updateStats(list, now) {
  const total = list.length;
  let gold = 0, vip = 0, active = 0, expired = 0, onetime = 0;
  list.forEach(k => {
    if (k.tier === 'gold') gold++; else vip++;
    if (k.key_type === 'one_time') {
      onetime++;
      if (k.is_active !== false) active++; else expired++;
    } else {
      const exp = k.expires_at || 0;
      if (exp === 0 || exp > now) active++; else expired++;
    }
  });
  document.getElementById('stats-bar').innerHTML = `
    <span>전체 ${total}</span>
    <span>골드 ${gold}</span>
    <span>VIP ${vip}</span>
    <span style="color:var(--ok)">활성 ${active}</span>
    <span style="color:var(--danger)">만료/사용 ${expired}</span>
    <span>1회용 ${onetime}</span>
  `;
}

function renderKeys(keys, now) {
  const container = document.getElementById('key-list');
  container.innerHTML = '';
  if (!keys.length) {
    container.innerHTML = '<div class="hint" style="text-align:center;padding:30px 0">발급된 키가 없습니다.</div>';
    return;
  }
  keys.forEach(keyObj => {
    const createDate = new Date(keyObj.created_at * 1000).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    let expText = "";
    let isExpired = false;
    if (keyObj.key_type === 'one_time') {
      if (keyObj.is_active === false) {
        isExpired = true;
        expText = '<b style="color:var(--danger)">1회용 · 사용 완료</b>';
      } else {
        expText = '<b style="color:var(--blue)">1회용 · 미사용</b>';
      }
    } else {
      const expiresAt = keyObj.expires_at || 0;
      if (expiresAt === 0) {
        expText = '<b style="color:var(--ok)">평생 무제한</b>';
      } else {
        const expDate = new Date(expiresAt * 1000).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        if (now > expiresAt) {
          isExpired = true;
          expText = `<b style="color:var(--danger)">만료 (${expDate})</b>`;
        } else {
          expText = `<b style="color:var(--ok)">만료: ${expDate}</b>`;
        }
      }
    }
    const deviceStatus = keyObj.bound_device_id
      ? '<span style="color:var(--blue)">기기 등록됨</span>'
      : '<span>미등록</span>';
    const tierClass = keyObj.tier === 'gold' ? 'tier-gold' : 'tier-vip';
    const tierLabel = keyObj.tier === 'gold' ? 'GOLD' : 'VIP';

    const div = document.createElement('div');
    div.className = 'key-item' + (isExpired ? ' expired' : '');
    div.innerHTML = `
      <div class="key-header">
        <div>
          <span class="tier-badge ${tierClass}">${tierLabel}</span>
          <span class="key-val" onclick="copyText('${keyObj.id}')">${keyObj.id}</span>
        </div>
        <div class="action-group">
          <button class="btn btn-small" onclick="resetDevice('${keyObj.id}')">초기화</button>
          <button class="btn btn-small danger" onclick="deleteKey('${keyObj.id}')">삭제</button>
        </div>
      </div>
      <div class="key-meta">
        <div>발급 ${createDate}</div>
        <div>${expText}</div>
        <div>${deviceStatus}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

async function resetDevice(keyId) {
  if (!confirm(`[${keyId}] 키의 기기 정보를 초기화할까요?\n새 기기에서 다시 인증할 수 있습니다.`)) return;
  const formData = new FormData();
  formData.append('admin_password', ADMIN_PASSWORD);
  formData.append('vip_key', keyId);
  try {
    const response = await fetch('/api/reset_key_device', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) { showMessage(`[${keyId}] 기기 초기화 완료`); loadKeys(); }
    else showMessage(data.error || "초기화 실패", true);
  } catch (e) { showMessage("서버 통신 오류", true); }
}

async function deleteKey(keyId) {
  if (!confirm(`[${keyId}] 키를 삭제할까요?`)) return;
  const formData = new FormData();
  formData.append('admin_password', ADMIN_PASSWORD);
  formData.append('vip_key', keyId);
  try {
    const response = await fetch('/api/delete_key', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) {
      showMessage(`[${keyId}] 키 삭제 완료`);
      if (document.getElementById('new-key').textContent === keyId)
        document.getElementById('new-key-container').classList.add('hidden');
      loadKeys();
    } else showMessage(data.error || "삭제 실패", true);
  } catch (e) { showMessage("서버 통신 중 오류가 발생했습니다.", true); }
}

function copyKey() {
  const text = document.getElementById('new-key').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showMessage("키가 클립보드에 복사되었습니다."));
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showMessage("복사되었습니다."));
}
</script>
</body>
</html>
