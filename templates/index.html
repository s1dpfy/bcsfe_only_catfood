<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>냥코 무료 재화 모딩</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Jua', sans-serif; 
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); 
            color: #191f28; 
            margin: 0; 
            padding: 24px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: #ffffff; 
            padding: 20px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            margin-bottom: 40px;
        }
        
        h2 { 
            font-size: 42px; 
            font-weight: normal; 
            text-align: left; 
            margin-top: 0; 
            margin-bottom: -8px; 
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .author {
            font-size: 25px;
            margin-bottom: 16px; 
            text-align: left;
            background: linear-gradient(135deg, #000000, #0004ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .section { margin-bottom: 14px; }
        
        label { 
            display: block; 
            font-weight: normal; 
            margin-bottom: 6px; 
            font-size: 19px; 
            background: linear-gradient(135deg, #333d4b 0%, #6b7684 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        input { 
            width: 100%; 
            padding: 12px 14px; 
            box-sizing: border-box; 
            background-color: #f2f4f6;
            border: 1px solid transparent; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            font-size: 22px; 
            font-family: 'Jua', sans-serif;
            color: #191f28;
            transition: all 0.2s;
            outline: none;
        }
        input::placeholder { font-size: 17px; }
        input:focus { 
            background-color: #ffffff;
            border-color: #3182f6; 
            box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #3182f6 0%, #1b64da 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 22px; 
            font-family: 'Jua', sans-serif;
            cursor: pointer; 
            transition: transform 0.1s, filter 0.2s; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.3);
        }
        button:active { transform: scale(0.98); }
        button:hover { filter: brightness(1.05); }
        
        .result-box { 
            background: linear-gradient(135deg, #e8f3ff 0%, #d4e8ff 100%); 
            padding: 16px; 
            border-radius: 14px; 
            margin-top: 14px; 
            display: none; 
            text-align: center; 
        }
        .result-title {
            font-size: 18px; 
            margin-bottom: 10px;
            background: linear-gradient(135deg, #1b64da 0%, #00308f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .code-group {
            background: #ffffff;
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 8px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .code-label { font-size: 14px; color: #8b95a1; }
        .code-val { 
            font-size: 20px; 
            letter-spacing: 0.5px; 
            margin-top: 2px; 
            word-break: break-all; 
            background: linear-gradient(135deg, #3182f6 0%, #0052cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-msg { color: #f04438; font-size: 14px; text-align: center; margin-top: 6px; }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .step-disabled { opacity: 0.4; pointer-events: none; transition: opacity 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h2>냥코 무료 재화</h2>
    <div class="author">제작자 냥슬리</div>

    <div class="section" id="step1">
        <input type="text" id="transferCode" placeholder="이어하기 코드 입력">
        <input type="text" id="confirmationCode" placeholder="인증 번호 입력">
        <button id="loadBtn" onclick="loadSave()">
            <span class="btn-text">세이브 불러오기</span>
            <div class="spinner" id="loadSpinner"></div>
        </button>
        <div id="loadError" class="error-msg"></div>
    </div>

    <div class="section step-disabled" id="step2">
        <label>원하는 통조림 개수</label>
        <input type="number" id="catfoodInput" placeholder="최대 45000">
        
        <label>원하는 XP</label>
        <input type="number" id="xpInput" placeholder="최대 99999999">

        <button id="modBtn" onclick="modifyAndUpload()">
            <span class="btn-text">모딩 후 새 코드 받기</span>
            <div class="spinner" id="modSpinner"></div>
        </button>
        <div id="modError" class="error-msg"></div>
    </div>

    <div id="resultSection" class="result-box">
        <div class="result-title">✨ 모딩 완료! 새 코드가 발급되었습니다</div>
        <div class="code-group">
            <div class="code-label">이어하기 코드</div>
            <div class="code-val" id="resTc">-</div>
        </div>
        <div class="code-group" style="margin-top: 6px;">
            <div class="code-label">인증 번호</div>
            <div class="code-val" id="resCc">-</div>
        </div>
    </div>
</div>

<script>
    async function loadSave() {
        const tc = document.getElementById('transferCode').value.trim();
        const cc = document.getElementById('confirmationCode').value.trim();
        const errDiv = document.getElementById('loadError');
        const btnText = document.querySelector('#loadBtn .btn-text');
        const spinner = document.getElementById('loadSpinner');
        
        errDiv.innerText = "";
        if(!tc || !cc) {
            errDiv.innerText = "코드를 모두 입력해주세요.";
            return;
        }

        btnText.style.display = 'none';
        spinner.style.display = 'block';
        document.getElementById('loadBtn').disabled = true;

        const formData = new URLSearchParams();
        formData.append('transfer_code', tc);
        formData.append('confirmation_code', cc);

        try {
            const res = await fetch('/api/load_save', { method: 'POST', body: formData });
            const data = await res.json();

            if(data.success) {
                sessionStorage.setItem('session_token', data.token);
                
                // 통조림과 XP 초기값 설정
                document.getElementById('catfoodInput').value = data.catfood;
                document.getElementById('xpInput').value = data.xp;

                const step2 = document.getElementById('step2');
                step2.classList.remove('step-disabled');
                step2.scrollIntoView({ behavior: 'smooth' });
            } else {
                errDiv.innerText = data.error;
            }
        } catch(e) {
            errDiv.innerText = "서버 통신 중 오류가 발생했습니다.";
        } finally {
            btnText.style.display = 'block';
            spinner.style.display = 'none';
            document.getElementById('loadBtn').disabled = false;
        }
    }

    async function modifyAndUpload() {
        const catfood = document.getElementById('catfoodInput').value;
        const xp = document.getElementById('xpInput').value;
        const errDiv = document.getElementById('modError');
        const btnText = document.querySelector('#modBtn .btn-text');
        const spinner = document.getElementById('modSpinner');
        const token = sessionStorage.getItem('session_token');

        errDiv.innerText = "";
        if(!token) {
            errDiv.innerText = "세션이 만료되었습니다. 페이지를 새로고침 후 다시 시도해주세요.";
            return;
        }
        // 통조림과 XP 빈값 체크
        if(!catfood || !xp) {
            errDiv.innerText = "통조림 개수와 XP를 모두 입력해주세요.";
            return;
        }

        btnText.style.display = 'none';
        spinner.style.display = 'block';
        document.getElementById('modBtn').disabled = true;

        const formData = new URLSearchParams();
        formData.append('catfood', catfood);
        formData.append('xp', xp); // 서버로 XP 데이터 전송

        try {
            const res = await fetch('/api/modify_and_upload', { 
                method: 'POST', 
                headers: { 'x-session-token': token },
                body: formData 
            });
            const data = await res.json();

            if(data.success) {
                document.getElementById('resTc').innerText = data.transfer_code;
                document.getElementById('resCc').innerText = data.confirmation_code;
                document.getElementById('resultSection').style.display = 'block';
                document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
            } else {
                errDiv.innerText = data.error;
            }
        } catch(e) {
            errDiv.innerText = "서버 통신 중 오류가 발생했습니다.";
        } finally {
            btnText.style.display = 'block';
            spinner.style.display = 'none';
            document.getElementById('modBtn').disabled = false;
        }
    }
</script>

</body>
</html>
