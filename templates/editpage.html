<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>세이브 수정 | 냥슬리 에디터</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cpath fill='%23f4f4f5' d='M12 30l6-18 10 14h8l10-14 6 18c4 6 4 20-20 24S8 36 12 30z'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%23111'/%3E%3Ccircle cx='40' cy='34' r='3' fill='%23111'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<link href="/static/css/editor.css" rel="stylesheet">
</head>
<body data-page="edit" data-tier="{{ tier }}">
<div class="app">
  <h1><i class="fa-solid fa-cat"></i>냥슬리 에디터</h1>
  <p class="sub">냥코 대전쟁 세이브 수정</p>
  <div class="panel">
    <div id="action-log" class="msg"></div>

    <section id="section-load" class="section active">
      <h2><i class="fa-solid fa-file-arrow-down"></i>세이브 불러오기</h2>
      <p class="hint">이어하기 코드와 인증 번호만 입력합니다.</p>
      <input id="transfer_code" class="input" placeholder="이어하기 코드" autocomplete="off">
      <input id="confirmation_code" class="input" placeholder="인증 번호" maxlength="6" autocomplete="off">
      <div class="stack" style="margin-top:8px">
        <button class="btn primary" onclick="loadSave()"><i class="fa-solid fa-download"></i>불러오기</button>
        <a class="btn" href="/"><i class="fa-solid fa-arrow-left"></i>메인으로</a>
      </div>
    </section>

    <section id="section-modify" class="section">
      <h2><i class="fa-solid fa-pen"></i>수정</h2>
      <p class="hint" id="tier-line">항목을 누르면 수량 창이 열립니다.</p>
      <div class="grid">
        <button class="btn" onclick="openResource('catfood')"><i class="fa-solid fa-jar"></i>통조림</button>
        <button class="btn" onclick="openResource('xp')"><i class="fa-solid fa-bolt"></i>XP</button>
        <button class="btn" onclick="openResource('normal')"><i class="fa-solid fa-ticket"></i>일반 티켓</button>
        <button class="btn hidden" id="btn-legend" onclick="openResource('legend')"><i class="fa-solid fa-scroll"></i>레전드 티켓</button>
        <button class="btn hidden" id="btn-platinum" onclick="openResource('platinum')"><i class="fa-solid fa-gem"></i>플래티넘 티켓</button>
        <button class="btn hidden" id="btn-catfruit" onclick="openResource('catfruit')"><i class="fa-solid fa-seedling"></i>개다래</button>
        <button class="btn hidden" id="btn-np" onclick="openResource('np')"><i class="fa-solid fa-coins"></i>NP</button>
        <button class="btn hidden" id="btn-catseyes" onclick="openResource('catseyes')"><i class="fa-solid fa-eye"></i>캣츠아이</button>
      </div>
      <div class="stack" style="margin-top:8px">
        <button class="btn primary" id="btn-upload" onclick="modifySave()"><i class="fa-solid fa-cloud-arrow-up"></i><span>변경사항 업로드</span></button>
        <a class="btn" href="/"><i class="fa-solid fa-arrow-left"></i>메인으로</a>
      </div>
    </section>

    <section id="section-result" class="section">
      <h2><i class="fa-solid fa-circle-check"></i>업로드 완료</h2>
      <p class="hint" id="result-desc">새 코드로 게임을 이어하세요. 칸을 누르면 복사됩니다.</p>
      <div class="cred" onclick="copyText('new_transfer_code')"><small>이어하기 코드</small><strong id="new_transfer_code"></strong></div>
      <div class="cred" onclick="copyText('new_confirmation_code')"><small>인증 번호</small><strong id="new_confirmation_code"></strong></div>
      <a class="btn" style="margin-top:10px" href="/"><i class="fa-solid fa-house"></i>처음으로</a>
    </section>
  </div>
</div>

<div id="modal-resource" class="modal hidden" onclick="if(event.target.id==='modal-resource') this.classList.add('hidden')">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="resource-title"><i class="fa-solid fa-pen"></i><span>수정</span></h2>
    <div id="resource-body"></div>
    <button class="btn" style="margin-top:10px" onclick="document.getElementById('modal-resource').classList.add('hidden')"><i class="fa-solid fa-xmark"></i>닫기</button>
  </div>
</div>
<script src="/static/js/editor.js"></script>
</body>
</html>
